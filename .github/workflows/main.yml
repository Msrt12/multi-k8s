name: Setup Googlecloud


on:
  push:
    branches: ["master"]

jobs:
  deploy:
    
    runs-on: ubuntu-latest

    steps:
      - name: install source code
        uses: actions/checkout@v4
      
      - name: Install Google Cloud SDK
        run: curl https://sdk.cloud.google.com | bash > /dev/null

      - name: Add gcloud to PATH
        run: source "$HOME/google-cloud-sdk/path.bash.inc"

      - name: Update kubectl component
        run: sudo apt-get install kubectl

      - name: Authenticate service account
        uses: google-github-actions/auth@v2
        with:
          credential_json: ${{ secrets.GCP_CREDENTIALS }}
      
      - name: Permission for gcloud to have access to our project 
        run: gcloud config set project $PROJECT_ID
        env:
          GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}

      - name: Set up our location
        run: gcloud config set compute/region $GCP_REGION
        env:
          GCP_REGION: ${{secrets.GCP_REGION}}

      - name: Set up our cluster
        run: gcloud container clusters get-credentials $GKE_CLUSTER
        env:
          GKE_CLUSTER: ${{ secrets.GKE_CLUSTER }}
          CLOUDSDK_CORE_DISABLE_PROMPTS: 1 

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}  
      
      - name: Build tests
        run: docker build -t mykoladmytrash/react-proj -f ./client/Dockerfile.dev ./client

      - name: Run tests
        run: docker run -e CI=true mykoladmytrash/react-proj npm test -- --coverage

      - name: Run bash 
        run: bash ./deploy.sh
        env:
          GIT_SHA: ${{ github.sha }}
          CLOUDSDK_CORE_DISABLE_PROMPTS: 1  