apiVersion: apps/v1
kind: Deployment
metadata:
  name: server-deployment

spec:
  replicas: 1
  selector:
    matchLabels:
      component: server
  template:
    metadata:
      labels:
        component: server
    spec:
      containers:
        - name: server
          image: rallycoding/multi-server-dev      
          ports:
            - containerPort: 5000
          env:
          - name: REDIS_HOST
            value: "redis-cluster-ip-service"
          - name: REDIS_PORT
            value: "6379"
          - name: PGUSER
            value: "postgres"
          - name: PGHOST
            value: "postgres-cluster-ip-service"
          - name: PGDATABASE
            value: "postgres"
          - name: PGPORT
            value: "5432"
          - name: POSTGRES_PASSWORD
            valueFrom:
              secretKeyRef:
                name: pgpassword
                key: PGPASSWORD
            resources:
            requests:
              cpu: "150m"
              memory: "256Mi"
            limits:
              cpu: "300m"
              memory: "512Mi"    

